[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctxcomp"
version = "0.2.0"
description = "Comparison suite for context-compression baselines on AppWorld; drives the ACON harness rather than re-implementing it"
requires-python = ">=3.10"

# The suite itself needs only a YAML reader to generate configs and one to read the
# manifest. Everything the baselines need at run time -- torch/llmlingua for the
# LLMLingua rows, appworld for the environment and its evaluator, tiktoken for the
# token metrics -- is a dependency of the ACON checkout it drives, not of this
# repository. See requirements.txt.
dependencies = ["pyyaml>=6"]

[tool.setuptools]
py-modules = ["make_configs", "compute_table"]
