[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctxcomp"
version = "0.1.0"
description = "Context compression for long-horizon LLM agents — baseline harness and metrics"
requires-python = ">=3.10"
dependencies = ["jinja2>=3.1", "tiktoken>=0.7", "pyyaml>=6", "appworld==0.1.3.post1"]

[project.scripts]
ctxcomp-check = "scripts.check_methods:main"

[tool.setuptools]
packages = ["ctxcomp", "ctxcomp.methods", "ctxcomp.metrics", "ctxcomp.runner"]
