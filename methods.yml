# Experiment suite -- one row per method, per compression axis.
# Single source of truth: make_configs.py, run_suite.sh and compute_table.py read it.
#
# ---------------------------------------------------------------------------
# Where the baselines actually run
# ---------------------------------------------------------------------------
# The harness is NOT in this repository. Every row is executed, unchanged, by the
# code in the ACON checkout named by ACON_ROOT:
#
#   compressor    src/productive_agents/ctxopt/{history,obs}_optimizer.py
#   trigger       src/productive_agents/agents/memory.py
#   agent loop    src/productive_agents/agents/unified_agent.py
#   entry point   experiments/appworld/run_all.py
#
# This repository owns the manifest, the prompt assets, the driver and the table.
# The one file that adapts anything is make_configs.py, and only where upstream's
# own config generator cannot express an observation row at all -- see its
# docstring. A baseline that were re-implemented here could differ from itself
# between runs, which is exactly what a comparison table must not contain.
#
# Local edits inside ACON are not invisible: they are patches/, with reasons and
# the command to revert. None of them touch a compression method, the agent, the
# budget or the metric; they make the harness executable against a self-hosted
# model instead of Azure.
#
# ---------------------------------------------------------------------------
# Two compression axes, not one
# ---------------------------------------------------------------------------
# ACON (Kang et al., ICML 2026) compresses two different things and reports them as
# two separate AppWorld experiment lines (section 4.2 has one subsection per axis):
#
#   history      h'_t = f(h_t; phi, P_hist)          if |h_t| > T_hist
#   observation  o'_t = f(o_t, h_{t-1}; phi, P_obs)  if |o_t| > T_obs
#
# They differ in input, in output shape, in threshold, and in the prompt being
# optimised: P_hist and P_obs are separately learned. The axis is therefore a
# property of the ROW (`kind:`), not a suffix on a method's name, and comparing a
# history row against an observation row is a category error.
#
# Not every method has both axes, and that is a fact about the method, not a gap to
# paper over. Discarding old turns (fifo) is a history mechanism; ACON's observation
# axis is defined on the CURRENT observation exceeding T_obs, so a recency window
# over observations is a different method and is listed under "not run" below.
#
# ---------------------------------------------------------------------------
# Thresholds -- and a divergence between the paper and the code that ships it
# ---------------------------------------------------------------------------
# Paper Appendix B.3: "For history compression, we set T_hist = 4096 for AppWorld
# and OfficeBench, and 2048 for 8-objective QA ... For observation compression, we
# set T_obs = 1024 for AppWorld, 512 for OfficeBench, and 400 for 8-objective QA."
#
# Upstream's generator (experiments/suite/make_configs.py) hard-codes 256 for the
# observation axis -- four times more aggressive than the paper states. The two are
# not compatible: an observation row at 256 fires far more often than the same row at
# 1024, so its Acc and its Peak are not the quantities the paper tabulates.
#
# These rows use the PAPER's values (T_hist = 4096, T_obs = 1024), set in
# make_configs.py, because the purpose of this table is to be read against the paper.
# The 256 lives on in the upstream file and, where it matters, is noted per row.
#
# ---------------------------------------------------------------------------
# Metric definitions (ACON paper Table 1)
# ---------------------------------------------------------------------------
#   Acc      mean success over `repeats` runs, from AppWorld's own evaluator
#   Pass^2   solved in ALL runs          } require repeats >= 2,
#   Pass@2   solved in AT LEAST ONE run  } print "-" when repeats == 1
#   Steps    mean environment interactions per task
#   Peak     max input context length over all steps, INCLUDING system prompt
#   Dep.     sum_t ((n_i + 2*n_o) * n_o) / 2, n_i EXCLUDES system prompt
#            (paper prints Peak in 10^3, Dep. in 10^6)
# Steps / Peak / Dep are read from analysis_tools.analyze_experiment_tokens_v2 --
# the implementation they were measured with -- and are not recomputed here.
#
# ---------------------------------------------------------------------------
# Prompt provenance
# ---------------------------------------------------------------------------
# prompts/ mirrors each upstream project. A file that is byte-identical to its
# source is `ported`. A template this repository authored -- because the upstream
# project ships no observation-level prompt -- is `derived`, and its row says so:
# a derived template is a different object of study from the published method it is
# attached to, and a reader has to be able to tell them apart.

benchmark: appworld
split: test_normal

# The model id the endpoint serves. This is a LABEL the server validates: an id it has
# not loaded is rejected, and nothing in the request reveals which weights answered.
# It is a hint rather than a setting -- run_suite.sh probes /v1/models before every
# round and adopts whatever the deployment actually answers to, so a redeploy cannot
# turn a round into a wall of 404s. When the two disagree, the run id carries the id
# that was really used. This deployment has changed ids four times in two days
# (deepseek-v4-flash <-> deepseek-v4.1-flash), which is why the value below is not
# trusted. It is also why every row is fingerprinted before and after it runs.
model: deepseek-v4.1-flash

# Agent prompt. MUST stay the answer-fixed variant: with the stock prompt the agent
# answers non-questions ("Done.") and fails AppWorld's answer assertion, which
# depresses every row equally and compresses the differences under study.
#
# NOTE: upstream's own manifest names `./prompts/prompts_v1_answerfix.jinja`. That
# file does not exist -- what exists is the JSON, whose `main_prompt_template` field
# points at the .jinja. A run in that checkout records
# `./prompts/prompts_v1_answerfix.json`, which is what is used here.
prompt_file: ./prompts/prompts_v1_answerfix.json

# Interaction budget per task. AppWorld's own default is 1000; upstream ACON
# hard-codes 50 in four places, which is 1/20 of the environment's own default.
# Under a 50 budget a task that hits the cap always fails, so the row score
# collapses to ~1 - (cap-hit rate) and the ranking measures step efficiency rather
# than context fidelity. Rows are only comparable at equal max_iter.
max_iter: 1000

# Independent runs per task. 1 gives Acc/Easy/Medium/Hard/Steps/Peak/Dep.
# 2 additionally gives Pass^2/Pass@2, at double the cost.
repeats: 1

rows:
  # ---------------------------------------------------------------- reference
  - name: no_compression
    label: No compression
    kind: none
    source: >
      Full uncompressed history, executed with no co_config at all. Reference for
      behaviour preservation and for the Peak/Dep units. It has no axis: it
      compresses nothing, so both axes are compared against this one row.

  # ------------------------------------------------------------ history axis
  - name: hist_fifo
    label: FIFO
    kind: history
    ctxopt: {prompt_dir: prompts/context_opt, system: system_prompt, history: prompt_history_v2}
    baseline: discard
    preserve_last_k_turns: 5
    source: >
      ACON recency baseline, memory.py::optimize_history with
      baseline_strategy=discard: once more than preserve_last_k_turns turns
      accumulate it drops whole turns oldest-first, keeping the first task
      instruction plus the last 5 turns. Discards the turn, not the observation --
      conflating the two would make this row and observation masking
      uninterpretable. The ctxopt prompt files are never read on this path; they
      exist because the config generator requires a resolvable pair.

  - name: hist_llmlingua
    label: LLMLingua
    kind: history
    ctxopt: {prompt_dir: prompts/context_opt, system: system_prompt, history: prompt_history_v2}
    llmlingua: true
    keep_rate: 0.30
    source: >
      LLMLingua-2 (microsoft/llmlingua-2-xlm-roberta-large-meetingbank) as ACON
      calls it: an out-of-repo HTTP service at localhost:9999 (base.py:213). NOTE:
      `keep_rate` in this manifest is copied from upstream's manifest but is NOT
      read by the code -- history_optimizer.py:117 hard-codes ratio=0.2, while the
      observation path hard-codes 0.3 (obs_optimizer.py:99). The row is therefore a
      20% keep rate, and the manifest says 0.30 only because upstream's does.

  - name: hist_prompting_o
    label: Prompting-O
    kind: history
    ctxopt: {prompt_dir: prompts/openclaw, system: system, history: update, first: first}
    source: >
      OpenClaw agent-core compaction (TRACE's Prompting-O), commit 0e7b5c3:
      `first` checkpoint prompt, then `update` folds new turns into the previous
      checkpoint. Strongest existing compressed baseline in TRACE (Acc 71.4 vs
      ACON-UT 62.5). Prompts: ported. Upstream's two prompts are composed into one
      template branching on `prev_summary` (make_configs.py::compose_two_stage),
      which is upstream's own adaptation, not a local one.

  - name: hist_prompting_h
    label: Prompting-H
    kind: history
    ctxopt: {prompt_dir: prompts/hermes, system: system, history: update, first: first}
    source: >
      NousResearch/hermes-agent, commit cca3b77: head and tail protected by a token
      budget, middle summarised, every checkpoint carrying a REFERENCE ONLY note.
      Prompts: ported (prefix.jinja included; upstream's make_configs copies it
      alongside the composed template).

  - name: hist_trace
    label: TRACE
    kind: history
    ctxopt: {prompt_dir: prompts/trace, system: system_prompt, history: update, first: first}
    source: >
      TRACE (Min et al., arXiv 2608.06503). Same benchmark and setting as this
      suite: AppWorld test-normal 168 (57/48/63), 4096-token window, frozen
      backbone. Template is the selected candidate_1 (policy_sha256 94d193fc...),
      rebuilt with the authors' own renderer; upstream pairs it with the base
      first-compaction prompt. Prompts: ported.

  - name: hist_acon_ut
    label: ACON-UT
    kind: history
    ctxopt: {prompt_dir: prompts/acon_ut, system: system, history: history}
    source: >
      ACON-UT P_hist: the utility-optimised history guideline, ported verbatim from
      paper Appendix E, "Prompt E.6: AppWorld Prompt for history compression after
      optimization (UT)". An earlier state of this row used a candidate from the local
      optimiser run (`prompt_optimizer/outputs/ut1/...`), which never went through the
      paper's selection stage; the published guideline is both the object the method
      is defined by and the one a table compared against the paper should carry. The
      starting point it was optimised from (Prompt E.5) is at
      prompts/acon_base/history.jinja, and the superseded local candidates are
      archived under prompts/_superseded/ with their sha256 in docs/CREDITS.md.

  - name: hist_acon_utco
    label: ACON-UT+CO
    kind: history
    ctxopt: {prompt_dir: prompts/acon_utco, system: system, history: history}
    source: >
      ACON-UT+CO P_hist: the utility+compression-optimised history guideline, ported
      verbatim from paper Appendix E, "Prompt E.7: AppWorld Prompt for history
      compression after optimization (UTCO)". Stage 1 (UT) maximises success rate;
      stage 2 (CO) shortens the guideline on the tasks that already succeed. This row
      previously used a local co1 candidate that had not been through selection; the
      paper carries the published guideline, so measuring the method as defined needs
      no optimiser re-run.

  # -------------------------------------------------------- observation axis
  - name: obs_llmlingua
    label: LLMLingua (obs)
    kind: obs
    ctxopt: {prompt_dir: prompts/context_opt, system: system_prompt, obs: prompt_user}
    llmlingua: true
    keep_rate: 0.30
    source: >
      ACON's observation-compression setting for LLMLingua: obs_optimizer.py:99
      prunes the current observation at ratio 0.3, which is the ratio the code
      hard-codes for this axis (the manifest's keep_rate is again not read).

  - name: obs_prompting_o
    label: Prompting-O (obs)
    kind: obs
    ctxopt: {prompt_dir: prompts/openclaw, system: system, obs: obs}
    source: >
      Observation axis with OpenClaw's compaction criteria. Prompts: DERIVED, not
      upstream -- OpenClaw ships no observation-level prompt. The template keeps
      OpenClaw's own preservation criteria and moves them onto the single
      observation task, so the row differs from its history counterpart only in what
      is being compressed. Read it as "Prompting-O adapted to the observation axis",
      never as the published Prompting-O.

  - name: obs_prompting_h
    label: Prompting-H (obs)
    kind: obs
    ctxopt: {prompt_dir: prompts/hermes, system: system, obs: obs}
    source: >
      Observation axis with Hermes's checkpoint criteria. Prompts: DERIVED, not
      upstream -- Hermes ships no observation-level prompt. Keeps Hermes's structured
      checkpoint shape and its REFERENCE ONLY prefix, applied to one observation
      instead of a conversation.

  - name: obs_trace
    label: TRACE (obs)
    kind: obs
    ctxopt: {prompt_dir: prompts/trace, system: system_prompt, obs: obs}
    source: >
      Observation axis with TRACE's criteria. Prompts: DERIVED, not upstream --
      TRACE addresses history compression only and publishes no observation prompt.
      Keeps TRACE's own criteria for what must survive compression, applied to the
      current observation.

  - name: obs_acon_ut
    label: ACON-UT (obs)
    kind: obs
    ctxopt: {prompt_dir: prompts/acon_ut, system: system, obs: obs}
    source: >
      ACON-UT P_obs: the optimised observation guideline, ported verbatim from paper
      Appendix E, "Prompt E.9: AppWorld Prompt for observation compression after
      optimization (UT)". Its input is (task, prior history, current observation) and
      its output is a "Refined Observation" -- distinguishable from P_hist, which
      takes (task, previous summary, history) and emits a structured checkpoint. The
      unoptimised counterpart (Prompt E.8) is kept at prompts/acon_base/obs.jinja so
      the two can be diffed without the paper.

  - name: obs_acon_utco
    label: ACON-UT+CO (obs)
    kind: obs
    ctxopt: {prompt_dir: prompts/acon_utco, system: system, obs: obs}
    source: >
      ACON-UT+CO P_obs: the compression-optimised observation guideline, ported
      verbatim from paper Appendix E, "Prompt E.10: AppWorld Prompt for observation
      compression after optimization (UTCO)". This row used to be refused by
      make_configs.py for want of an observation guideline for the CO stage; the
      paper carries one, so the row runs.

# Rows deliberately NOT run, and why:
#
#   obs_fifo        ACON's observation axis compresses the CURRENT observation when
#                   it alone exceeds T_obs. Upstream implements no non-LLM
#                   observation truncation, so this row could only exist by
#                   implementing a method in this repository -- which is what the
#                   suite must not do. History-axis fifo covers the recency
#                   baseline.
#   retrieval       A-MEM-style k-turn selection is memory selection, not long-
#                   horizon compression. TRACE omits it as a baseline too.
#   observation_masking
#                   "The Complexity Trap" (arXiv 2508.21433) matches summarisation on
#                   SWE-bench Verified, but its authors restrict it to verbose tool
#                   output in software engineering, and its baselines/cost metrics
#                   do not align with this table. A positioning caveat, not a row.
