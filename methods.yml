# One entry per method. Single source of truth: run_suite.py, compute_table.py and
# check_methods.py all read this file.
#
# Adding a method = add entries here + drop its prompt files under
# ctxcomp/prompts/. A missing prompt is a hard error: it does not raise anywhere
# in the execution path -- the compressor would fall back to a default, the row
# would still produce numbers, and the table would look fine while the row means
# nothing.
#
# ---------------------------------------------------------------------------
# Two compression axes, not one
# ---------------------------------------------------------------------------
# ACON (Kang et al., ICML 2026) compresses two different things and reports them as
# two separate AppWorld experiment lines (section 4.2 has one subsection per axis):
#
#   history      h'_t = f(h_t; phi, P_hist)          if |h_t| > T_hist
#   observation  o'_t = f(o_t, h_{t-1}; phi, P_obs)  if |o_t| > T_obs
#
# They differ in input, in output format, in threshold, and in the prompt being
# optimised: P_hist and P_obs are separately learned. A compression method
# therefore has two rows, and comparing a history row against an observation row
# is a category error.
#
# Every method except no_compression is split into a hist_* and an obs_* row. The
# observation axis is not "drop old observations": by equation (4) it applies to
# the CURRENT observation when that observation alone is too long.
#
# ---------------------------------------------------------------------------
# Thresholds
# ---------------------------------------------------------------------------
# T_hist = 4096, T_obs = 1024, from the paper's analysis section, which states
# that medium values are best and names these two.
#
# Deviation to be aware of: our earlier ACON-harness suite used T_obs = 256, four
# times more aggressive than the paper. Those obs runs never completed, so no
# result rests on 256; it is recorded here because any obs_* number from that
# harness is not comparable with a paper number without noting the difference.
#
# ---------------------------------------------------------------------------
# What each row needs
# ---------------------------------------------------------------------------
#   policy: builtin   a mechanism, no prompt (fifo, llmlingua)
#   policy: prompt    a prompt directory; one code path for all of them
#
# For prompt-driven methods the observation template must exist as
# <prompts.dir>/obs.jinja. Where the upstream project ships no observation prompt,
# the template is derived from that project's own history prompt so the
# preservation criteria stay the same, and the row says so in `source`. The
# alternative -- reusing one generic observation prompt across several methods --
# would make those rows identical to each other while appearing to be different
# methods.

benchmark: appworld
split: test_normal

# The model name sent in the request. It must be an id the endpoint actually
# serves, or every call fails -- the server does not accept aliases for a model it
# has not loaded. Check with:
#     curl -s $BASE/v1/models -H "Authorization: Bearer $KEY" | python -m json.tool
#
# This is a LABEL, not an identity. The endpoint here has been redeployed four
# times in a day under three different names while the weights changed underneath,
# so a run directory records a behavioural fingerprint of the backbone alongside
# this name, and the two disagreeing is the signal that a row is unattributable.
model: deepseek-v4-flash

# Agent system prompt. Must be the answer-fixed variant: with the stock prompt the
# agent answers non-questions ("Done.") and fails AppWorld's answer assertion,
# which depresses every method equally and compresses the differences we are
# trying to measure.
prompt_file: prompts/prompts_v1_answerfix.jinja

# Interaction budget per task. AppWorld's own default is 1000; the upstream ACON
# code hard-codes 50 in four places, which is 1/20 of the environment's own
# default. Under a 50 budget a task that hits the cap always fails, so the row
# score collapses to ~1 - (cap-hit rate) and the ranking measures step efficiency
# rather than context fidelity. Rows are only comparable at equal max_iter.
max_iter: 1000

# Independent runs per task. 1 gives Acc/Easy/Medium/Hard/Steps/Peak/Dep.
# 2 additionally gives Pass^2/Pass@2, at double the cost.
repeats: 1

thresholds:
  history: 4096
  observation: 1024

rows:
  # ---------------------------------------------------------------- reference
  - name: no_compression
    label: No compression
    axis: none
    policy: builtin
    source: >
      Full uncompressed history. Reference for behaviour preservation and for the
      Peak/Dep units. Not split into hist_/obs_: it compresses nothing, so the
      axis does not apply, and both axes are compared against this one row.

  # ---------------------------------------------------------------------- fifo
  - name: hist_fifo
    label: FIFO (history)
    axis: history
    policy: builtin
    keep_last: 5
    source: >
      Recency-only sliding window. Discards whole turns oldest-first: the
      difference between "drop the turn" and "keep the action, drop the
      observation" is the difference between this and observation masking, and
      conflating them would make both rows uninterpretable.

  - name: obs_fifo
    label: FIFO (observation)
    axis: observation
    policy: builtin
    keep_last: 5
    source: >
      Non-LLM observation truncation: when the current observation alone exceeds
      T_obs, keep its head and tail up to the budget. Chosen over "drop old
      observations" because equation (4) compresses the CURRENT observation, and a
      recency window over observations would be a different method.

  # ----------------------------------------------------------------- llmlingua
  - name: hist_llmlingua
    label: LLMLingua (history)
    axis: history
    policy: builtin
    keep_rate: 0.30
    source: >
      Token-level extractive pruning with LLMLingua-2
      (microsoft/llmlingua-2-xlm-roberta-large-meetingbank) applied to the
      compressible history. Keep rate 30%, as in the ACON paper.

  - name: obs_llmlingua
    label: LLMLingua (observation)
    axis: observation
    policy: builtin
    keep_rate: 0.30
    source: >
      Same pruner applied to the current observation when it exceeds T_obs. This
      is the row ACON calls observation compression with LLMLingua.

  # --------------------------------------------------------------- prompt-O
  - name: hist_prompting_o
    label: Prompting-O (history)
    axis: history
    policy: prompt
    prompts: {dir: openclaw, system: system, first: first, update: update}
    source: >
      OpenClaw agent-core compaction, commit 0e7b5c3. Two-stage: a `first`
      checkpoint prompt, then an `update` prompt that folds new turns into the
      previous checkpoint. Named Prompting-O in TRACE, where it is the strongest
      existing compressed baseline (Acc 71.4, vs ACON-UT 62.5).

  - name: obs_prompting_o
    label: Prompting-O (observation)
    axis: observation
    policy: prompt
    prompts: {dir: openclaw, system: system, obs: obs}
    source: >
      DERIVED, not from upstream: OpenClaw ships no observation-level prompt. The
      template keeps OpenClaw's own preservation criteria and moves them onto the
      single-observation task, so the row differs from Prompt-O only in what is
      being compressed.

  # --------------------------------------------------------------- prompt-H
  - name: hist_prompting_h
    label: Prompting-H (history)
    axis: history
    policy: prompt
    prompts: {dir: hermes, system: system, first: first, update: update, prefix: prefix}
    source: >
      NousResearch/hermes-agent, commit cca3b77. Head (system + first exchange) and
      tail protected by a token budget, middle summarised. Every checkpoint is
      prefixed with a REFERENCE ONLY note telling the agent not to re-answer
      resolved questions and to let the latest user message win on conflict.

  - name: obs_prompting_h
    label: Prompting-H (observation)
    axis: observation
    policy: prompt
    prompts: {dir: hermes, system: system, obs: obs, prefix: prefix}
    source: >
      DERIVED, not from upstream: Hermes ships no observation-level prompt. Keeps
      Hermes's structured checkpoint shape and its REFERENCE ONLY prefix, applied
      to one observation instead of the conversation.

  # ------------------------------------------------------------------- trace
  - name: hist_trace
    label: TRACE (history)
    axis: history
    policy: prompt
    prompts: {dir: trace, system: system_prompt, first: first, update: update}
    source: >
      TRACE (Min et al., arXiv 2608.06503). Same benchmark and setting as here:
      AppWorld test-normal 168 (57/48/63), 4096-token window, frozen backbone.
      Template is the selected candidate_1 (policy_sha256 94d193fc...), rebuilt
      with the authors' own renderer. candidate_1 is the iterative-update prompt;
      upstream pairs it with the base first-compaction prompt.

  - name: obs_trace
    label: TRACE (observation)
    axis: observation
    policy: prompt
    prompts: {dir: trace, system: system_prompt, first: first, obs: obs}
    source: >
      DERIVED, not from upstream: TRACE addresses history compression only and
      publishes no observation prompt. Keeps TRACE's own criteria for what must
      survive compression, applied to the current observation.

  # -------------------------------------------------------------------- acon
  - name: hist_acon_ut
    label: ACON-UT (history)
    axis: history
    policy: prompt
    prompts: {dir: acon_ut, system: system, update: history}
    source: >
      ACON utility-optimised history guideline. NOTE: this is our own ut1 optimiser
      run on the AppWorld train split, not the guideline the ACON authors shipped
      -- UT/CO output depends on the trajectories and the agent prompt it was
      optimised against, so two faithful reproductions of the method produce two
      different texts. Record the guideline sha256 with any result.

  - name: obs_acon_ut
    label: ACON-UT (observation)
    axis: observation
    policy: prompt
    prompts: {dir: acon_ut, system: system, obs: obs}
    source: >
      Authentic observation prompt: ACON's own P_obs template, whose input is
      (task, prior history, current observation) and whose output is a "Refined
      Observation". Distinguishable from P_hist, which takes (task, previous
      summary, history) and emits a structured checkpoint.
      Caveat, stronger than for hist_acon_ut: P_obs is optimised for its own
      objective, and our local optimiser run only ever produced a history
      guideline, so this row uses the shipped template rather than an optimised
      observation guideline.

  - name: hist_acon_utco
    label: ACON-UT+CO (history)
    axis: history
    policy: prompt
    prompts: {dir: acon_utco, system: system, update: history}
    source: >
      ACON utility+compression-optimised history guideline, i.e. the second
      optimiser stage on top of UT. Stage 1 (utility) maximises success rate; stage
      2 (compression) optimises length on the tasks that already succeed, writing
      files prefixed `length_optimized_history_prompt_`. NOT PRESENT: only the ut1
      stage has been run locally, so the directory is empty and check_methods.py /
      run_suite.py refuse the row rather than quietly substituting a default.

  - name: obs_acon_utco
    label: ACON-UT+CO (observation)
    axis: observation
    policy: prompt
    prompts: {dir: acon_utco, system: system, obs: obs}
    source: >
      Requires the joint UT+CO optimiser run on the observation objective
      (upstream: experiments/prompt_optimizer/
      unified_compress_update_observation_prompt.py). Never run. NOT PRESENT for
      the same reason as hist_acon_utco.
